[project]
name = "hunterai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "anthropic>=1.0",
    "stripe>=11.1",
    "python-docx>=1.1",
    "pypdf>=5.1",
]

[project.optional-dependencies]
# O detector neural é opcional: sem estas libs o serviço cai para heurísticas.
detector = [
    "torch>=2.5",
    "transformers>=4.46",
]
dev = [
    "pytest>=8.3",
    "httpx2>=0.1",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
