[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunterai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # [email] traz o email-validator, exigido pelo EmailStr de schemas/auth.py.
    # Sem o extra, o import de app.main quebra e a API não sobe.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "anthropic>=1.0",
    "stripe>=11.1",
    "python-docx>=1.1",
    "pypdf>=5.1",
]

[project.optional-dependencies]
# O detector neural é opcional: sem estas libs o serviço cai para heurísticas.
detector = [
    "torch>=2.5",
    "transformers>=4.46",
]
dev = [
    "pytest>=8.3",
    "httpx2>=0.1",
    "ruff>=0.7",
]

# Sem isto o setuptools enxerga `app/` e `alembic/` como dois pacotes top-level
# e aborta o build ("Multiple top-level packages discovered in a flat-layout").
# `alembic/` é script de migration, não faz parte do pacote distribuído.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# O diretório `alembic/` faz o ruff achar que `alembic` é código nosso e
# agrupar `from alembic import op` junto de `app.*`. É biblioteca de terceiro.
known-third-party = ["alembic"]
