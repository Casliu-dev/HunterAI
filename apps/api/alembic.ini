# Configuração do Alembic.
#
# A URL do banco NÃO fica aqui: `alembic/env.py` a lê de `settings.database_url`
# (ou seja, da env `DATABASE_URL`). Assim o compose, a máquina local e a CI usam
# a mesma fonte de verdade, e a senha não é versionada.

[alembic]
script_location = alembic

# Permite `import app...` dentro do env.py rodando de apps/api/.
prepend_sys_path = .

# Ex.: 20260915_1430_a1b2c3_cria_tabela_x.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Datas dos arquivos de migration em UTC.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
